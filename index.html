    <script>
      (() => {
        const seatSelect = document.getElementById('seatSelect');
        const seatNote = document.getElementById('seatNote');
        const mapSelect = document.getElementById('mapSelect');
        const mapNote = document.getElementById('mapNote');
        window.__selectedHumanCount = 1;
        window.__selectedMapId = 'suibianTemple';
        seatSelect.addEventListener('click', event => {
          const button = event.target.closest('[data-human-count]');
          if (!button) return;
          const count = Number(button.dataset.humanCount);
          window.__selectedHumanCount = count;
          seatSelect.querySelectorAll('[data-human-count]').forEach(option => {
            const selected = Number(option.dataset.humanCount) === count;
            option.classList.toggle('selected', selected);
            option.setAttribute('aria-pressed', String(selected));
          });
          seatNote.textContent = count === 1 ? '1 位玩家自由选角，其余由电脑补位' : `${count} 位玩家控制前 ${count} 个球，其余由电脑补位`;
          document.dispatchEvent(new CustomEvent('game-player-count-change', { detail: count }));
        });
        mapSelect.addEventListener('click', event => {
          const button = event.target.closest('[data-map-id]');
          if (!button) return;
          const id = button.dataset.mapId;
          window.__selectedMapId = id;

    function loadToySdk(){
      if(window.toy?.isSupport)return Promise.resolve(window.toy);
      const script=document.querySelector('script[data-toy-sdk]');
      if(!script||script.dataset.state==='failed')return Promise.resolve(null);
      return new Promise(resolve=>{
        let settled=false;
        const finish=()=>{
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          resolve(window.toy?.isSupport?window.toy:null);
        };
        const timer=setTimeout(finish,4000);
        script.addEventListener('load',finish,{once:true});
        script.addEventListener('error',finish,{once:true});
        if(script.dataset.state==='loaded')finish();
      });
    }

    async function requestToyLandscapeOnLaunch(){
      const toyApi=await loadToySdk();
      if(!toyApi?.isSupport)return;
      let unsubscribe=null;
      try{
        if(!await toyApi.isSupport('setContainerMode'))return;
        const current=await toyApi.getContainerState();
        if(!['phone','tablet'].includes(current.deviceType))return;
        if(current.orientation==='landscape'&&current.immersive)return;
        let targetReached=false;
        const handleContainerChange=state=>{
          if(state.orientation==='landscape'&&state.immersive){
            targetReached=true;
            unsubscribe?.();
            unsubscribe=null;
          }
        };
        unsubscribe=toyApi.onContainerChange(handleContainerChange);
        if(targetReached){unsubscribe?.();unsubscribe=null;return;}
        window.addEventListener('pagehide',()=>unsubscribe?.(),{once:true});
        await toyApi.setContainerMode({orientation:'landscape',immersive:true});
      }catch{
        unsubscribe?.();
      }
    }
    requestToyLandscapeOnLaunch();

    const setupErrorText = document.getElementById('setupErrorText');

      const THREE = await import(engineUrl);

      function createAudioDirector(){

          if(!AudioContextClass)return false;

            context=new AudioContextClass();master=context.createGain();musicBus=context.createGain();sfxBus=context.createGain();compressor=context.createDynamicsCompressor();
            compressor.threshold.value=-17;compressor.knee.value=9;compressor.ratio.value=4;compressor.attack.value=.004;compressor.release.value=.22;
            musicBus.gain.value=.72;sfxBus.gain.value=.92;musicBus.connect(compressor);sfxBus.connect(compressor);compressor.connect(master);master.connect(context.destination);updateMaster();
          }
          if(context.state==='suspended')context.resume().catch(()=>{});
          return true;
        }
        function getNoiseBuffer(){
          if(noiseBuffer)return noiseBuffer;
          noiseBuffer=context.createBuffer(1,Math.ceil(context.sampleRate*.65),context.sampleRate);
          const samples=noiseBuffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
          return noiseBuffer;
        }
        function tone(frequency,duration,options={}){
          if(!ensure())return;
          const time=options.time??context.currentTime+.01,osc=context.createOscillator(),env=context.createGain();
          osc.type=options.wave||'sine';osc.frequency.setValueAtTime(Math.max(1,frequency),time);

          if(options.filterHz){const filter=context.createBiquadFilter();filter.type=options.filterType||'lowpass';filter.frequency.setValueAtTime(options.filterHz,time);if(options.filterEnd)filter.frequency.exponentialRampToValueAtTime(options.filterEnd,time+duration);osc.connect(filter);source=filter;}

        function scheduleStep(index,time){
          if(!musicMode||paused)return;
          const s=index%16,bar=Math.floor(index/16)%4,menu=musicMode==='menu';

            victim.lastHitBy=attacker.index;victim.lastHitTime=elapsed;
            if(!registerGravityKnockback(victim,victimDelta))victim.launch=Math.max(victim.launch,.72);
            victim.hit=Math.max(victim.hit,.48);
            audio.launch(victimDelta);
            makeImpactVector(victim.x,victim.z,vx,vz,victimDelta,attacker.data.hex);makeEffect((a.x+b.x)*.5,(a.z+b.z)*.5,attacker.data.hex,1.05);
            if(newContact&&attacker.skillTime>0&&(attackSkill.effect==='rush'||(attackSkill.effect==='arc'&&attacker.skillArcTime>0)))triggerSkillVisual(attacker,attackSkill.effect,(a.x+b.x)*.5,(a.z+b.z)*.5);
          } else if(impulse>0){
            registerGravityKnockback(a,impulse*invA);registerGravityKnockback(b,impulse*invB);
            if(bounceBeat&&impulse>.62){a.launch=Math.max(a.launch,.5);b.launch=Math.max(b.launch,.5);}
            if(approachA>approachB+.15){b.lastHitBy=a.index;b.lastHitTime=elapsed;}
            else if(approachB>approachA+.15){a.lastHitBy=b.index;a.lastHitTime=elapsed;}
          }
          const strength=guardCounter?Math.max(impulse,guardConfig.counterImpulse??2.4):impulse;
          if(strength>.62){
            audio.collision(strength,Boolean(victim));
            a.hit=Math.max(a.hit,.24);b.hit=Math.max(b.hit,.24);a.flash=Math.max(a.flash,.18);b.flash=Math.max(b.flash,.18);shake=Math.max(shake,Math.min(.16,strength*.012));
            if(!victim&&impulse>2.2&&Math.random()<.5)makeEffect((a.x+b.x)*.5,(a.z+b.z)*.5,'#fff2cf',.9);
          }
          if(!activeContacts.has(contactKey)&&(victim||strength>.62)){
            rewardedThisFrame.add(contactKey);
            if(victim&&attacker)awardSkillEnergy(attacker,20);
            else if(approachA>approachB+.15)awardSkillEnergy(a,20);
            else if(approachB>approachA+.15)awardSkillEnergy(b,20);
            else {awardSkillEnergy(a,20);awardSkillEnergy(b,20);}
          }
        }
        for(const key of activeContacts)if(!overlappingThisFrame.has(key))activeContacts.delete(key);
        for(const key of rewardedThisFrame)activeContacts.add(key);
      }

      function updatePlayer(p,dt){
        const skill=p.data.skillConfig??window.CHARACTER_SKILL_CONFIG.generic;
        const skillWasActive=p.skillTime>0;
        if(skillWasActive)p.skillTime=Math.max(0,p.skillTime-dt);
        if(skillWasActive&&p.skillTime<=0&&skill.postSkillSleepSeconds>0&&phase==='playing'&&!p.eliminated&&p.fall<=0){
          const sleepDuration=skill.postSkillSleepSeconds;p.sleepTime=sleepDuration;p.boost=false;p.wasBoosting=false;p.skillArcTime=0;inputHeld.delete(p.index);
          const sleepEffect=skill.postSkillSleepEffect??'sleep';
          triggerSkillVisual(p,sleepEffect);
          skillCutins.play({slot:p.index,characterId:p.data.characterId,color:p.data.hex,duration:p.sleepTime,headline:skill.postSkillSleepHeadline??'进入休息',warning:`${sleepDuration}秒${skill.postSkillSleepWarning??'无法操作'}`,effect:sleepEffect,compactHeadline:skill.postSkillSleepCompactHeadline??'休息中',compactLabel:skill.postSkillSleepCompactLabel??'无法操作'});
        }
        if(p.sleepTime>0)p.sleepTime=Math.max(0,p.sleepTime-dt);
        p.skillArcCooldown=Math.max(0,p.skillArcCooldown-dt);
        const skillActive=p.skillTime>0;
        const sleeping=p.sleepTime>0;
        const sizeMultiplier=skillActive?(skill.sizeMultiplier??1):1;
        p.r=BALL_R*sizeMultiplier;
        skillEffects.setSleepIndicator({key:p.index,x:p.x,z:p.z,visible:sleeping&&!p.eliminated});
        if(!skillActive)p.skillArcTime=0;
        p.skillAura.visible=skillActive;
        if(skillActive){
          const beat=Math.sin(elapsed*11+p.index);
          const pulse=1.015+beat*.065;
          p.skillAura.scale.setScalar(pulse);p.skillAura.userData.orbit.rotation.y=-elapsed*3.2;
          p.skillAura.userData.ring.material.opacity=.78+beat*.18;
          p.skillAura.userData.outerRing.material.opacity=.58+beat*.28;
        }else p.skillAura.scale.setScalar(1);
        if(p.isLeader){
          const crownPulse=1+Math.sin(elapsed*5+p.index)*.05;
          p.leaderCrown.scale.setScalar(.76*crownPulse);p.leaderCrown.rotation.y=Math.sin(elapsed*2.2+p.index)*.08;
        }else{p.leaderCrown.scale.setScalar(.76);p.leaderCrown.rotation.y=0;}
        if(p.fall>0){
          p.chargeArrow.visible=false;p.fall-=dt;p.group.position.y-=dt*4.7;p.group.rotation.x+=dt*4.1;p.group.rotation.z+=dt*4.5;
          p.group.scale.multiplyScalar(1-dt*.45);
          if(p.fall<=0){
            if(p.eliminated){p.group.visible=false;return;}
            const angle=Math.random()*Math.PI*2,r=currentSafeRadius*.52;
            p.x=safeX+Math.cos(angle)*r;p.z=safeZ+Math.sin(angle)*r;p.vx=0;p.vz=0;p.launch=0;p.gravityHitAge=-1;p.lastHitBy=-1;p.heading=angle+Math.PI;p.group.visible=true;p.group.rotation.set(0,p.heading,0);p.group.scale.setScalar(sizeMultiplier);p.group.position.set(p.x,TOP_Y+p.r,p.z);p.aiWait=.6+Math.random()*.8;
          }
          return;
        }
        if(p.eliminated){p.group.visible=false;return;}
        p.group.visible=true;
        if(p.index>=humans&&p.skillEnergy>=100&&p.skillTime<=0&&p.sleepTime<=0&&phase==='playing')activateSkill(p);
        p.launch=Math.max(0,p.launch-dt);
        const wasBoosting=p.wasBoosting;
        if(sleeping){p.boost=false;p.wasBoosting=false;inputHeld.delete(p.index);}
        else if(p.index<humans)p.boost=inputHeld.has(p.index);
        else runAI(p,dt);
        if(!sleeping&&!wasBoosting&&p.boost&&p.index<humans)audio.dashStart();
        if(!sleeping&&!wasBoosting&&p.boost&&skillActive&&skill.effect==='rush')triggerSkillVisual(p,'rush');
        if(!sleeping&&wasBoosting&&!p.boost)p.spin=-p.spin;
        p.wasBoosting=sleeping?false:p.boost;
        if(skillActive&&skill.effect==='arc'&&p.boost&&p.skillArcTime<=0&&p.skillArcCooldown<=0){
          p.skillArcTime=skill.arcSeconds;p.skillArcElapsed=0;p.skillArcStartHeading=p.heading;p.skillArcDirection=p.spin<0?-1:1;
          p.skillArcCooldown=skill.arcCooldownSeconds??.85;triggerSkillVisual(p,'arc');
        }
        const arcActive=skillActive&&skill.effect==='arc'&&p.skillArcTime>0;
        const gravityBeat=currentBeatId==='gravity'&&currentMapId==='livehouse404'?MAP_BEATS.gravity:null;
        const speedBeat=currentBeatId==='speed'&&currentMapId==='livehouse404'?MAP_BEATS.speed:null;
        const hitAge=p.gravityHitAge;
        let gravityPhase=null,gravityControl=1;
        if(gravityBeat&&hitAge>=0){
          if(hitAge<gravityBeat.kickSeconds){gravityPhase='kick';gravityControl=gravityBeat.kickControl;}
          else if(hitAge<gravityBeat.kickSeconds+gravityBeat.brakeSeconds){gravityPhase='brake';gravityControl=gravityBeat.brakeControl;}
          else if(hitAge<gravityBeat.kickSeconds+gravityBeat.brakeSeconds+gravityBeat.driftSeconds){gravityPhase='drift';gravityControl=gravityBeat.driftControl;}
        }
        if(hitAge>=0){p.gravityHitAge+=dt;if(p.gravityHitAge>MAP_BEATS.gravity.kickSeconds+MAP_BEATS.gravity.brakeSeconds+MAP_BEATS.gravity.driftSeconds)p.gravityHitAge=-1;}
        if(arcActive){
          p.skillArcElapsed=Math.min(skill.arcSeconds,p.skillArcElapsed+dt);
          const progress=p.skillArcElapsed/skill.arcSeconds,eased=progress*progress*(3-2*progress);
          p.heading=p.skillArcStartHeading+p.skillArcDirection*skill.arcAngle*eased;
          const arcAcceleration=skill.arcAcceleration*(skill.arcSpeedMultiplier??1)*(.72+.28*Math.sin(Math.PI*progress));
          p.vx+=Math.sin(p.heading)*arcAcceleration*dt;p.vz+=Math.cos(p.heading)*arcAcceleration*dt;
          p.skillArcTime=Math.max(0,p.skillArcTime-dt);
        }else if(!p.boost&&!sleeping)p.heading+=p.spin*dt*(gravityBeat?.turnRate??1);
        const fx=Math.sin(p.heading),fz=Math.cos(p.heading);
        const rushMultiplier=skillActive?skill.sprintAccelerationMultiplier??1:1;
        const speedMultiplier=skillActive?skill.sprintTopSpeedMultiplier??1:1;
        const normalSpeedMultiplier=skillActive?skill.normalTopSpeedMultiplier??1:1;
        if(p.boost){const accel=15.5*rushMultiplier*(speedBeat?.sprintAcceleration??1)*gravityControl;p.vx+=fx*accel*dt;p.vz+=fz*accel*dt;}
        let drag=p.launch>0?.996:p.boost?.989:.945;
        if(currentBeatId==='ice'&&currentMapId==='livehouse404')drag=p.launch>0?MAP_BEATS.ice.launchDrag:p.boost?MAP_BEATS.ice.sprintDrag:MAP_BEATS.ice.normalDrag;
        if(gravityPhase==='kick')drag=gravityBeat.kickDrag;
        else if(gravityPhase==='brake')drag=gravityBeat.brakeDrag;
        else if(gravityPhase==='drift')drag=gravityBeat.driftDrag;
        p.vx*=Math.pow(drag,dt*60);p.vz*=Math.pow(drag,dt*60);
        const currentSpeed=Math.hypot(p.vx,p.vz);
        let max;
        if(gravityPhase==='kick')max=15*gravityBeat.kickSpeedCap;
        else if(gravityPhase==='brake')max=Math.max(5.5*gravityBeat.speedCap,currentSpeed);
        else if(gravityPhase==='drift')max=gravityBeat.driftSpeedCap;
        else{
          const baseMax=p.launch>0?15:sleeping?Math.max(5.5,currentSpeed):arcActive?7.2*(skill.arcSpeedMultiplier??1):p.boost?7.2*speedMultiplier*(speedBeat?.speedCap??1):5.5*normalSpeedMultiplier*(speedBeat?.speedCap??1);
          max=baseMax*(gravityBeat?.speedCap??1);
        }
        const speed=currentSpeed;
        if(speed>max){p.vx*=max/speed;p.vz*=max/speed;}
        if(currentMapId==='hollowMetro')window.HollowMap.move(p,dt);
        else if(currentMapId==='livehouse404')window.MapLayout.move(p,dt,stageLampColliders);
        else{p.x+=p.vx*dt;p.z+=p.vz*dt;}
        if(sleeping)skillEffects.setSleepIndicator({key:p.index,x:p.x,z:p.z,visible:!p.eliminated});
        p.hit=Math.max(0,p.hit-dt*1.6);p.flash=Math.max(0,p.flash-dt*2.4);
        const square=currentMapId==='hollowMetro'?{distance:Math.abs(p.x),edge:window.HollowMap.layout.halfX-p.r*.82,nx:Math.sign(p.x)||1,nz:0}:currentMapId==='livehouse404'?window.MapLayout.boundary(p.x,p.z,STAGE_R,p.r):null;
        const radial=square?square.distance:Math.hypot(p.x,p.z),hasWall=hasRimWall(p.x,p.z,p.r);
        const edge=square?square.edge:hasWall?WALL_RADIUS-WALL_THICKNESS*.5*arenaScale-p.r:STAGE_R-p.r*.82;
        if(radial>edge){
          const nx=square?square.nx:p.x/(radial||1),nz=square?square.nz:p.z/(radial||1),outward=p.vx*nx+p.vz*nz;
          if(hasWall){
            p.x=nx*edge;p.z=nz*edge;
            if(outward>0){p.vx-=nx*outward*1.4;p.vz-=nz*outward*1.4;}
            if(outward>.65){p.hit=Math.max(p.hit,.16);p.flash=Math.max(p.flash,.12);shake=Math.max(shake,.035);makeEffect(p.x,p.z,'#ffe0a2',.48);audio.wall(outward);}
          } else if(outward>.3||radial>edge+.52){
            let attacker=null,best=-1;
            for(const other of players){if(other===p||other.eliminated||other.fall>0)continue;const d=Math.hypot(p.x-other.x,p.z-other.z);const s=Math.hypot(other.vx,other.vz)+(other.boost?3:0);if(d<1.55&&s>best){best=s;attacker=other;}}
            knockout(p,attacker);
          } else {if(square){p.x=Math.max(-edge,Math.min(edge,p.x));p.z=Math.max(-edge,Math.min(edge,p.z));}else{p.x=nx*edge;p.z=nz*edge;}p.vx-=nx*Math.max(0,outward)*1.55;p.vz-=nz*Math.max(0,outward)*1.55;}
        }
        const squash=1-p.hit*.28;
        p.group.position.set(p.x,TOP_Y+p.r+Math.sin(elapsed*8+p.index)*.025+(p.boost?.06:0),p.z);
        p.group.rotation.set(Math.sin(elapsed*15+p.index)*p.hit*.14,p.heading,Math.cos(elapsed*13+p.index)*p.hit*.14);
        const sleepWobble=sleeping?1+Math.sin(elapsed*8+p.index)*.035:1;
        p.group.scale.set(sizeMultiplier*sleepWobble*(1+p.hit*.2),sizeMultiplier*sleepWobble*squash,sizeMultiplier*sleepWobble*(1+p.hit*.2));
        const leaderGlow=p.isLeader?.32+Math.sin(elapsed*4+p.index)*.06:.12;
        p.ballMaterial.emissiveIntensity=leaderGlow+p.flash*.9+(p.boost?.24:0)+(p.skillTime>0?.4:0);
        p.chargeArrow.visible=p.boost;
        if(p.boost){p.chargeArrow.position.set(p.x+fx*(p.r*.8),TOP_Y+.18,p.z+fz*(p.r*.8));p.chargeArrow.setDirection(new THREE.Vector3(fx,0,fz));p.chargeArrow.setLength(1.3+Math.min(1,Math.hypot(p.vx,p.vz)*.045),.3,.22);}
      }

      function simulate(dt){
        elapsed+=dt;
        if(phase==='countdown'){
          countdown-=dt;remaining=matchLength;
          const word=countdown>1.55?'READY':countdown>.72?'SET':'GO!';setBanner(word,true);
          if(word!==lastCountdownWord){audio.countdown(word);lastCountdownWord=word;}
          if(countdown<=0){phase='playing';setBanner('');}
        } else if(phase==='playing'){
          roundElapsed+=dt;
          updateMapBeatCycle(dt);
          if(currentMapId==='hollowMetro')hollowState=hollowCycle.update(roundElapsed);
          if(currentMapId==='starloopArena')starloopCycle.update(roundElapsed,players);
          remaining=Math.max(0,remaining-dt);
          const collapseStart=matchLength*.75;
          damagePerSecond=hasPoisonCircle()?poisonDamagePerSecondAt(roundElapsed):currentMapId==='hollowMetro'?8:0;
          if(damagePerSecond!==lastPlayedDps){audio.setIntensity(damagePerSecond);lastPlayedDps=damagePerSecond;}
          if(currentMapId==='suibianTemple'&&roundElapsed>=collapseStart&&!shrinkCuePlayed){audio.shrinkCue();shrinkCuePlayed=true;}
          moveSafeZone();
          for(const p of players)updatePlayer(p,dt);
          solveCollisions();
          if(currentMapId==='hollowMetro')players.forEach(p=>{if(!p.eliminated&&p.fall<=0)window.HollowMap.resolve(p);});
          damageOutsidePlayers(dt);
          const alive=players.filter(p=>!p.eliminated).length;
          if(alive<=1)finishMatch('last');
          else if(remaining<=0&&!suddenDeath){suddenDeath=true;setBanner('SUDDEN DEATH · LAST BALL',true);}
        } else if(phase==='paused'){
          // The scene stays visible while play is paused.
        } else if(phase==='finished'){
          for(const p of players)if(p.fall>0)updatePlayer(p,dt);
        }
        moveSafeZone();
        for(let i=effects.length-1;i>=0;i--){
          const e=effects[i];e.life-=dt;e.mesh.position.x+=e.vx*dt;e.mesh.position.z+=e.vz*dt;e.mesh.position.y+=e.vy*dt;e.vy-=5.8*dt;e.mesh.material.opacity=Math.max(0,e.life/e.max);e.mesh.scale.multiplyScalar(1-dt*.6);
          if(e.life<=0){stageRoot.remove(e.mesh);e.mesh.geometry.dispose();e.mesh.material.dispose();effects.splice(i,1);}
        }
        for(let i=impactArrows.length-1;i>=0;i--){
          const effect=impactArrows[i];effect.life-=dt;
          const opacity=Math.max(0,effect.life/effect.total);
          effect.group.children.forEach(part=>{part.material.opacity=opacity;part.scale.set(1,Math.max(.01,opacity),1);});
          if(effect.life<=0){stageRoot.remove(effect.group);effect.group.children.forEach(part=>{part.geometry.dispose();part.material.dispose();});impactArrows.splice(i,1);}
        }
        skillEffects.update(dt,phase==='paused');
        if(shake>0){stageRoot.position.set((Math.random()-.5)*shake,0,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*.6);}else stageRoot.position.set(0,0,0);
        if(elapsed-lastUi>.12){updateScoreboard();updateUi();lastUi=elapsed;}
      }

      let last=performance.now();
      let fpsSampleStart=last,fpsSampleFrames=0;
      function frame(now){
        requestAnimationFrame(frame);
        if(showFpsReadout){
          fpsSampleFrames++;
          if(now-fpsSampleStart>=500){
            fpsReadout.textContent=`FPS ${Math.round(fpsSampleFrames*1000/(now-fpsSampleStart))}`;
            fpsSampleFrames=0;fpsSampleStart=now;
          }
        }
        const dt=Math.min(.045,(now-last)/1000);last=now;
        simulate(dt);
        mapVisuals.update(phase==='paused'?0:dt);
        if(currentMapId==='hollowMetro')hollowVisuals.update(hollowState,roundElapsed);
        starloopVisuals.update(starloopCycle.drop,roundElapsed,players);
        skillCutins.update(dt,phase!=='playing');
        for(const p of players)if(p.eliminated||p.skillTime<=0&&p.sleepTime<=0)skillCutins.cancel(p.index);
        renderer.render(scene,camera);
        if(document.body.classList.contains('selecting-character')){
          const previewCanvas=previewRenderer.domElement;const w=previewCanvas.clientWidth,h=previewCanvas.clientHeight;
          if(w&&h){const ratio=previewRenderer.getPixelRatio();if(previewCanvas.width!==Math.floor(w*ratio)||previewCanvas.height!==Math.floor(h*ratio)){previewRenderer.setSize(w,h,false);const aspect=w/h,halfHeight=1.2,halfWidth=halfHeight*aspect;previewCamera.left=-halfWidth;previewCamera.right=halfWidth;previewCamera.top=halfHeight;previewCamera.bottom=-halfHeight;previewCamera.updateProjectionMatrix();if(previewPortrait)previewPortrait.children[0].scale.setScalar(Math.min(.94,halfWidth*.88));}previewRenderer.render(previewScene,previewCamera);}
        }
      }
      requestAnimationFrame(frame);
      setBanner('READY WHEN YOU ARE',true);
      applyHumanCount=count=>{audio.uiTick();humans=count;renderAll();};
      renderControls();
      startButton.disabled=false;
      startButton.textContent='下一步：选择角色';
    }
  </script>
