<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>圆球碰碰擂台 · 离线启动器</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head><body>
<iframe id="g" src="index.html" allow="autoplay"></iframe>
<script>
// 绕过原站"直接打开即跳回线上"的守卫：游戏以 iframe 顶层尺寸运行，点击后键盘直接生效。
document.getElementById('g').addEventListener('load',function(){this.contentWindow.focus();});
document.addEventListener('keydown',function(e){var f=document.getElementById('g');if(f.contentWindow!==document.activeWindow)f.focus();});
</script>
</body></html>
